server:
  port: 8081

logging:
  level:
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG

spring:
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/market-bd}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis
  thymeleaf:
    reactive:
      max-chunk-size: 8192
  security:
    oauth2:
      client:
        registration:
          market-app:
            client-id: ${MARKET_APP_CLIENT_ID:market-app}
            client-secret: ${MARKET_APP_CLIENT_SECRET:market-secret}
            authorization-grant-type: client_credentials
            provider: market-keycloak
        provider:
          market-keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/market/protocol/openid-connect/token}

payment:
  service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${PAYMENT_SERVICE_TIMEOUT_MS:2000}